# Shipped by severance: loads scripts/severance-access.lua into the owner's
# WirePlumber, so clients arriving through an enclave's PipeWire socket see
# only their own enclave's objects (docs/enclave-user.md). An integrator
# places this file in the owner's wireplumber.conf.d and the script in the
# owner's wireplumber scripts directory.
wireplumber.components = [
  {
    name = severance-access.lua, type = script/lua
    provides = script.severance-access
  }
]

wireplumber.profiles = {
  main = {
    script.severance-access = required
  }
}
