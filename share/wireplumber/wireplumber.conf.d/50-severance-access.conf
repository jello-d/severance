# Shipped by severance: loads scripts/severance-access.lua into the owner's
# WirePlumber, so clients arriving through an enclave's PipeWire socket see
# only their own enclave's objects (docs/enclave-user.md). An integrator
# places this file in the owner's wireplumber.conf.d and the script in the
# owner's wireplumber scripts directory.
#
# WANTED, NOT REQUIRED, measured both ways: a REQUIRED component whose
# script is missing makes WirePlumber exit at start (78), costing the owner
# ALL audio; a wanted one is skipped and WirePlumber runs, and enclave
# clients are then granted nothing, so they fail closed. It hangs off the
# stock client-access policy, whose own wants this rule APPENDS to (the
# stock access scripts still load beside it, measured).
wireplumber.components = [
  {
    name = severance-access.lua, type = script/lua
    provides = script.severance-access
  }
]

wireplumber.components.rules = [
  {
    matches = [ { provides = "policy.client.access" } ]
    actions = { merge = { wants = [ script.severance-access ] } }
  }
]
